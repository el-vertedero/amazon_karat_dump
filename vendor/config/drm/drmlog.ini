# {prefix}_DRM_LOG_ENABLE_ALL_FEATURE=0/1 (enable all features for the same prefix block)
# {prefix}_DRMCOMMON_DRM_LOG=0/1 (enable drmcommon part features)

WIDEVINE_DRM_LOG_LEVEL=5
WIDEVINE_DRM_LOG_ENABLE_ALL_FEATURE=1
WIDEVINE_DRMCOMMON_DRM_TRACER=0
WIDEVINE_LICENSE_DURATION=0
