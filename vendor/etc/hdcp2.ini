
# for both TEE/nonTEE case
#[General]
#Note: HDCP RX Key support multiple key path definition
#      The order stands for the priority order, 1st, 2nd, etc.
#Example as below:
#HDCP_RX_KEY_PATH=/certificate/hdcp2_key.bin,/Customer/hdcp2_key.bin
HDCP_RX_KEY_PATH=/certificate/hdcp2_key.bin
HDCP_TX_KEY_PATH=/certificate/hdcp2_tx_key.bin

#[Miracast]
HDCP_MIRACAST_PORT=0
HDCP_MIRACAST_REPEATER=0
HDCP_TX_MAJOR_VERSION=2
HDCP_TX_MINOR_VERSION=3
HDCP_RX_MAJOR_VERSION=2
HDCP_RX_MINOR_VERSION=3
HDCP_TX_PRECOMPUTE_L=1
HDCP_RX_PRECOMPUTE_L=1
#0:legacy mode
#1:normal mode
HDCP_DECRYPT_MODE=0

#[HDMI]
#0:polling mode
#1:interrupt mode
HDMI_I2C_MODE=1
#unit: ms
HDMI_TX_POLLING_TIME=400
HDMI_TX_CIPHER_ENC_TIME=200

#[Debug]
#0&1:default,:2:trace,3:info,4:warning,5:debug,6:error,7:fatal,8:silent
LOG_PRIORITY=6
TEE_LOG_PRIORITY=6
MLOG_ENABLE=0
DUMP_DATA=0
CHECK_VERSION_ALIGNMENT=1
DISABLE_LOAD_RX_KEY=0
DISABLE_LOAD_TX_KEY=0
STR_TRACE_MODE_ENABLE=0
ENABLE_DECRYPT_PAYLOAD_TRACE=0
ENABLE_GET_NEXT_FRAME_TRACE=0
ENABLE_COPY_FRAME_TRACE=0
ENABLE_FLUSH_BUFFER_TRACE=0
ENABLE_CLOSE_SVP_TRACE=0

#[Performance Check]
#0:disable,1:enable
PERF_ENABLE=0
#0:console,1:file
PERF_DUMP_MODE=1
#dump file path, such as /data/hdcp2xProfile.log,/tmp/hdcp2xProfile.log,/opt/hdcp2xProfile.log
PERF_DUMP_FILE_PATH=/data/hdcp2xProfile.log
#dump to file frequency (unit: data amount)
PERF_DUMP_FREQ=1
